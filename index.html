<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <title>jQuery</title>
  <style>
  #panel, #flip {
    padding: 5px;
    text-align: center;
    background-color: #e5eecc;
  }

  #panel {
    padding: 50px;
    display: none;
  }
  </style>
</head>
<body>
  <div id="flip">Slide</div>
  <div id="panel">
    <p>and apples still grow in november</p>
    <p>when blossoms still bloom from each tree</p>
    <p>when leaves are still green in december</p>
    <p>its then that our land will be free</p>
  </div>
  <script>
  $(document).ready(function(){
  $("#flip").click(function(){
    $("#panel").slideToggle("slow");
  });
  });
  </script>
</body>
</html>
