<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Language Switch Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.6;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    select {
      margin-top: 20px;
      padding: 8px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1 id="title"></h1>
  <p id="description"></p>

  <h2 id="sectionTitle"></h2>
  <p id="description2"></p>
  
  <button id="action-btn"></button>

  <h3 id="footerTitle"></h3>
  <p id="footerText"></p>

  <br><br>
  <select id="languageSelect">
    <option value="en">English</option>
    <option value="bn">বাংলা</option>
  </select>

  <script src="script.js"></script>
</body>
</html>
