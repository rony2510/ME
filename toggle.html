<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <title>jQuery</title>
</head>
<body>
  <button id="toggle">Toggle</button>
  <p>and apples still grow in november</p>
  <button id="toggle1" type="button" name="button">Toggle</button>
  <div id="div1" style="background-color:pink;">
    <p>when blossoms still bloom from each tree<br>
    when leaves are still green in december<br>
    its then that our land will be free
    </p>
  </div>

  <script>
    $(document).ready(function(){
      $("#toggle").click(function(){
        $("p").toggle(2000);
      });
    });
  </script>
  <script>
    $(document).ready(function(){
      $("#toggle1").click(function(){
        $("#div1").toggle(3000);
      });
    });
  </script>
</body>
</html>
